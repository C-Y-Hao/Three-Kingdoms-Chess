<!DOCTYPE html>
<html>
<head>
    <title>TKC</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f0f0; }
        
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a1a;
            display: flex; justify-content: center; align-items: center;
            z-index: 999;
        }

        .auth-card {
            background: rgba(45, 30, 20, 0.95);
            padding: 40px;
            border: 2px solid #8b4513;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 320px;
            text-align: center;
            color: #f5deb3;
        }

        .input-group { margin-bottom: 20px; text-align: left; }

        input {
            width: 100%;
            padding: 10px;
            background: #3e2723;
            border: 1px solid #5d4037;
            color: #fff;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .auth-button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            width: 49%;
        }
        
        

        .btn-login { background: #b71c1c; color: white; }
        .btn-reg { background: #455a64; color: white; }

        #auth-status { color: #ffeb3b; font-size: 14px; margin-top: 15px; }
        
        #main-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fdfaf2 center/cover;
            background-color: #fdfaf2;
            display: none; justify-content: center; align-items: center;
            z-index: 999;
        }
        
        .menu-card {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            margin: 0;
            border: none;
            background: #fdfaf2;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .menu-title {
            color: #d4af37;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 5px #000;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .menu-btn {
            width: 100%;
            background: #d69046;
            color: #fdfaf2;
            border:none;
            padding: 20px 20px;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-weight: bold;
            width: 90%;
        }

        .menu-btn:hover {
            background: #6d4c41;
            transform: scale(1.05);
            border-color: #d4af37;
        }

        .menu-btn.primary { background: #3d99c5; border-color: #05288b; }
        .menu-btn.danger { background: #8b0000; border-color: #ff0000; margin-top: 10px; }

        .icon { margin-right: 10px; font-size: 1.2em; }

        #user-info-bar {
            margin-top: 25px;
            color: #aaa;
            font-size: 0.9em;
            border-top: 1px solid #5d4037;
            padding-top: 10px;
        }
        
        #recruit-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fdfaf2 center/cover;
            background-color: #fdfaf2;
            display: none; justify-content: center; align-items: center;
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        
        .recruit-card {
            background: #2d1e14;
            padding: 30px;
            border: 3px solid #d4af37;
            text-align: center;
            width: 80%;
            max-width: 500px;
        }

        .recruit-display {
            height: 200px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.5em;
        }
        
        h1 {
            display: inline-block;
            margin: 10px 0 0 20px;
            background: #8b4513;
            color: #fdfaf2;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            font-size: 16px;
        }
        
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
        }

        #round-display {
            width: calc(80vmin + 10px);
            max-width: 810px;
            
            background: #444;
            color: #ffd700;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 1.2em;
            
            border-radius: 10px 10px 0 0;
            border: 5px solid #444;
            border-bottom: none;
            
            box-sizing: border-box;
            letter-spacing: 5px;
        }
        
        #map {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            
            width: 80vmin;
            height: 80vmin;
            max-width: 800px;
            max-height: 800px;
            margin-top: 0;
            gap: 2px;
            background-color: #333;
            border: 5px solid #444;
            border-radius: 0 0 5px 5px;
            margin: 0 auto;
        }

        .cell {
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            font-size: 1.5vmin;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .status-fire {
            box-shadow: inset 0 0 12px #ff4d4d !important;
            background-color: #ffe6e6 !important;
        }
        .status-fire::after {
            content: "🔥";
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 14px;
        }

        .status-ice {
            box-shadow: inset 0 0 12px #00d4ff !important;
            background-color: #e6faff !important;
        }
        .status-ice::after {
            content: "❄️";
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 14px;
        }

        .status-evade {
            background-color: #ffffff !important;
            filter: brightness(1.2) contrast(0.8);
            border: 1px solid #ddd;
        }

        #sidebar {
            width: 260px;
            height: calc(80vmin + 55px);
            max-height: 845px;
            
            background: #fdfaf2;
            border: 2px solid #8b4513;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 3px 3px 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }
        
        #sidebar::after {
            content: "";
            position: absolute;
            bottom: 15px;
            left: 2px;
            right: 2px;
            height: 30px;
            background: linear-gradient(transparent, #fdfaf2);
            pointer-events: none;
            z-index: 10;
            border-radius: 0 0 10px 10px;
        }
        
        #side-info-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
            padding-bottom: 20px;
            &::-webkit-scrollbar {
                display: none;
            }

            scrollbar-width: none;

            -ms-overflow-style: none;
        }
        
        #side-name {
            margin: 0;
            font-size: 1.5em;
            padding-bottom: 8px;
            border-bottom: 2px solid #8b4513;
            text-align: center;
            color: #333;
        }
        
        #sidebar-right {
            width: 260px;
            height: calc(80vmin + 55px);
            max-height: 845px;
            
            background: #fdfaf2;
            border: 2px solid #8b4513;
            border-radius: 10px;
            padding: 15px;
            box-shadow: -3px 3px 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }

        #right-side-title {
            margin: 0;
            font-size: 1.5em;
            padding-bottom: 8px;
            border-bottom: 2px solid #8b4513;
            text-align: center;
            color: #333;
            font-weight: bold;
        }

        #right-info-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
            padding-bottom: 20px;
            
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #right-info-container::-webkit-scrollbar {
            display: none;
        }

        .global-stat-item {
            background: rgba(139, 69, 19, 0.05);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #8b4513;
        }

        #bond-list-ui {
            margin-top: 15px;
        }

        .bond-item {
            background: #fff;
            border-left: 4px solid #e74c3c;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.05);
        }

        .option-btn { padding: 10px; margin: 5px; cursor: pointer; }
        
        .bar-container { width: 85%; height: 4px; background: #eee; margin: 2px auto; border-radius: 2px; }
        .hp-bar { height: 100%; background: #ff4444; transition: width 0.3s; }
        .mp-bar { height: 100%; background: #4444ff; transition: width 0.3s; }
        
        .hero-card {
            background: #fdfaf2;
            width: 320px;
            border: 4px double #8b4513;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: cardZoom 0.3s ease-out;
        }
        
        @keyframes cardZoom {
            from {transform: scale(0.8); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }
        
        .card-skill {
            background: #eee;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #ccc;
        }
        
        .card-footer {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        
        .card-btn {
            padding: 8px 25px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .confirm { background: #8b4513; color: white; }
        .cancel { background: #999; color: white; }
        .confirm:hover { background: #ff4444; }
        
        #result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .result-content {
            background: #fdfaf2;
            padding: 40px 60px;
            border: 5px double #8b4513;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            max-width: 500px;
            animation: slideIn 0.8s ease-out;
        }


        .result-stats {
            margin: 20px 0;
            padding: 15px;
            background: #eee;
            border-radius: 10px;
            font-size: 1.1em;
        }

        .retry-btn {
            background: #8b4513;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .retry-btn:hover {
            background: #ff4444;
            transform: scale(1.05);
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        #fixed-game-guide {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: #fdfaf2;
            color: #8b4513;
            padding: 10px 15px;
            border: 2px solid #8b4513;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background 0.2s;
        }

        #fixed-game-guide:hover {
            background: #eee5d8;
            transform: translateY(-3px);
            box-shadow: 2px 6px 15px rgba(0,0,0,0.4);
        }

        .guide-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1 id="game-title">Three Kingdoms Chess</h1>
    
    <div class="main-container">
        <div id="sidebar-right">
            <h2 id="right-side-title">勢力概況</h2>
            <div id="right-info-container">
                <div class="global-stat-item">
                    財富值：<span id="stat-gold" style="color: #d4af37; font-weight: bold;">0</span>
                </div>
                <div class="global-stat-item">
                    繁榮度：<span id="stat-prosperity" style="color: #27ae60; font-weight: bold;">0</span>
                </div>

                <div id="bond-list-ui">
                    <p style="margin: 5px 0; font-weight: bold; color: #8b4513;">當前羈絆：</p>
                    <div id="bond-content">
                        <span style="color: #999;">尚未達成任何羈絆</span>
                    </div>
                </div>
                <div id="controls" style="display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px;">
                    <h3 id="turn-info" style="text-align: center; color: #ff4444;">輪到：準備中</h3>
                    <div id="action-pad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
                        <div></div>
                        <button class="option-btn" onclick="sendAction('W')">▲</button>
                        <div></div>
                    
                        <button class="option-btn" onclick="sendAction('A')">◀</button>
                        <button class="option-btn" onclick="sendAction('0')">Skip</button>
                        <button class="option-btn" onclick="sendAction('D')">▶</button>
                        
                        <div></div>
                        <button class="option-btn" onclick="sendAction('S')">▼</button>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="game-area">
            <div id="round-display">
                第 <span id="round-number">1</span> 回合
                <div id="warning-msg" style="display:none; font-size: 0.7em; color: #ff4444; background: rgba(0,0,0,0.2); margin-top: 5px; padding: 2px; border-radius: 3px;">
                    ⚠️ 剩餘 5 回合
                </div>
            </div>
            <div id="map"></div>
        </div>

        <div id="sidebar">

            <h2 id="side-name">選取武將</h2>
            <hr>
            <div id="side-info-container">
                <div id="side-info">
                    <p>部署階段：請點擊淡色區域放置武將。</p>
                </div>
                <div id="skill-info" style="margin-top: 15px; padding: 10px; background: #fffbe6; border: 1px dashed #ffe58f; border-radius: 5px; display: none;">
                    <b style="color: #b8860b;">【技能】</b> <span id="skill-name">無</span> <br>
                    <small id="skill-desc" style="color: #666;">尚未選取武將</small>
                </div>
            </div>
        </div>
        
    </div>

    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10;"></div>

    <div id="menu" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; border-radius:10px; z-index:11; text-align:center; min-width: 250px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        <button onclick="closeMenu()" style="position:absolute; top:5px; right:10px; border:none; background:none; cursor:pointer; font-size:24px; color:#999;">&times;</button>
        <h2 id="menu-title">選擇劇本</h2>
        <div id="options"></div>
    </div>
    
    <div id="result-screen" style="display: none;">
        <div class="result-content">
            <h1 id="result-status">戰鬥結束</h1>
            <div class="result-detail">
                <p>經過了 <span id="final-round">0</span> 回合的激戰</p>
                <h2 id="winner-name">獲得勝利</h2>
            </div>
            <div class="result-stats" id="stats-list">
                </div>
            <button class="retry-btn" onclick="location.reload()">重啟遊戲</button>
        </div>
    </div>
    
    <div id="hero-card-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
        <div class="hero-card">
            <h2 id="card-hero-name">武將姓名</h2>
            <div class="card-body">
                <p><strong>勢力：</strong><span id="card-faction">--</span></p>
                <p><strong>攻擊力：</strong><span id="card-attack">--</span></p>
                <p><strong>防禦力：</strong><span id="card-defense">--</span></p>
                <div class="card-skill">
                    <h4 id="card-skill-name">技能名稱</h4>
                    <p id="card-skill-desc">技能詳細描述...</p>
                </div>
            </div>
            <div class="card-footer">
                <button id="btn-confirm-select" class="card-btn confirm">選擇</button>
                <button onclick="closeHeroCard()" class="card-btn cancel">取消</button>
            </div>
        </div>
    </div>
    
    <a href="https://c-y-hao.github.io/Three-Kingdoms-Chess-guide/" target="_blank" id="fixed-game-guide">
        <span class="guide-icon">📜</span> 遊戲指南
    </a>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="TKC_Frontend.js"></script>
</body>
</html>
